# 배포 뒤 미리 깨우기 (11/03 콜드 스타트 조사).
#
# 새 배포의 서버 함수는 바이트코드 캐시가 비어 있어 첫 요청이 2~3초 걸렸다(proxy 함수 + 페이지 함수를 차례로 깨운다).
# Vercel이 main 커밋에 "Vercel success" 상태를 달면, 운영 주소가 그 커밋을 내보내는지(HTML의 sw.js?v=<커밋 12자리>) 확인한 뒤
# 앱 화면들을 몇 번 불러 함수를 깨우고 캐시를 채운다. 사용자가 그 비용을 치르지 않게 하려는 것이다.
# - 비로그인 요청만 보낸다(쿠키 없음). 서버는 DB를 부르지 않고, 화면 JS를 실행하지 않으므로 분석 이벤트도 생기지 않는다.
# - 더 새 커밋이 먼저 올라가 운영 주소가 이 커밋을 내보내지 않으면 조용히 끝난다.
# - 각 요청의 첫 바이트와 완료 시간을 로그에 남긴다(첫 회차가 콜드 스타트, 이후가 깨어난 뒤).
# 출처: Vercel 문서 Fluid compute "Bytecode caching", GitHub 문서 "Events that trigger workflows: status"
name: warm-after-deploy

on:
  status:

permissions: {}

jobs:
  warm:
    if: >-
      github.event.context == 'Vercel' &&
      github.event.state == 'success' &&
      contains(github.event.branches.*.name, 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SITE: https://lunchmate-kr.vercel.app
      SHA: ${{ github.event.sha }}
    steps:
      - name: 운영 주소가 이 커밋을 내보낼 때까지 기다리기
        id: wait
        run: |
          want="sw.js?v=${SHA:0:12}"
          for i in $(seq 1 30); do
            if curl -fsS -A "lunchmate-warmup" -o page.html "$SITE/today" && grep -q "$want" page.html; then
              echo "live=true" >> "$GITHUB_OUTPUT"; echo "운영 주소가 ${SHA:0:12}를 내보냅니다"; exit 0
            fi
            sleep 10
          done
          echo "live=false" >> "$GITHUB_OUTPUT"; echo "운영 주소가 이 커밋이 아닙니다(더 새 배포가 있음). 건너뜁니다"

      - name: 앱 화면 미리 깨우기
        if: steps.wait.outputs.live == 'true'
        # 하나씩 차례로 부른다. 첫 판(11/03)은 12개를 동시에 보내 Vercel이 인스턴스를 더 띄웠고, 그 새 인스턴스들이 다시
        # 콜드 스타트를 겪었다(2회차도 1~3초). 2분 동안 10초 간격으로 되풀이해 바이트코드 캐시가 쌓이게 한다.
        run: |
          paths="/today /map /poll /me / /login"
          for round in $(seq 1 12); do
            echo "== ${round}회차"
            for p in $paths; do
              # 화면 요청(HTML)과 탭 이동 때 쓰는 RSC 요청
              curl -s -o /dev/null -A "lunchmate-warmup" \
                -w "  %{http_code} 첫바이트 %{time_starttransfer}s 완료 %{time_total}s  $p\n" "$SITE$p"
              curl -s -o /dev/null -A "lunchmate-warmup" -H "RSC: 1" \
                -w "  %{http_code} 첫바이트 %{time_starttransfer}s 완료 %{time_total}s  $p (RSC)\n" "$SITE$p"
            done
            sleep 10
          done
