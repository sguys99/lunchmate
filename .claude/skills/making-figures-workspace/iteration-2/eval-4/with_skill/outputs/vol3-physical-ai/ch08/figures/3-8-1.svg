<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-labelledby="f381-t f381-d" font-family="Pretendard, 'Pretendard Variable', -apple-system, 'Apple SD Gothic Neo', sans-serif" style="font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'">
  <title id="f381-t">그림 3-8-1 이중 시스템 VLA</title>
  <desc id="f381-d">이중 시스템 VLA를 System 2, 잠재 표현, System 1, 행동으로 이어지는 블록도로 나타냈습니다. VLM인 System 2는 장면과 지시를 받아 약 7~9 Hz로 느리게 잠재 표현을 냅니다. 작은 정책인 System 1은 이 잠재 표현과 고속 센서 입력을 받아 200 Hz로 빠르게 행동을 냅니다. 느린 System 2의 잠재 표현을 빠른 System 1이 행동으로 바꿉니다.</desc>
  <defs><marker id="f381-arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.5 L8,5 L1,8.5" fill="none" stroke="#59606B" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter"/></marker>
<marker id="f381-arr-ink900" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.5 L8,5 L1,8.5" fill="none" stroke="#1F2329" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter"/></marker></defs>
