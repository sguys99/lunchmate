  <title id="f144v-t">그림 1-4-4 '안'이 토큰을 보는 정도 (EPUB 세로 변형)</title>
  <desc id="f144v-d">토큰 '안'이 상자가, 안, 왔어요를 얼마나 보는지를 연결 띠의 굵기로 나타냈습니다. 가중치는 상자가 0.140, 안 0.284, 왔어요 0.576이고 셋을 더하면 1입니다. 가장 굵은 띠가 왔어요로 이어져, '안'은 '왔어요'를 가장 많이 봅니다.</desc>
