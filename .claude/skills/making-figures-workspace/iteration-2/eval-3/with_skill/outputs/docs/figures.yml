  note: "가로축은 눈금 글자에 단위를 붙인 안(1단계, 5단계, 10단계, 20단계)을 고름. 320 판에 가로축 제목 자리가 없어서이며 style-guide 6.5절과 겹쳐 저자 확인 대기. 지시선 없음: 메시지 선 옆 빈자리가 맥락 선 사이라 문장이 선을 가림, 칩 2개와 캡션이 메시지를 전함. 세로 변형(5.11절 선택): 폭 328에서 칩 숫자가 7.2 CSS px라 360 x 328 사본을 같은 스크립트로 만듦. 곡선은 정본 식 p^n을 0.25 간격으로 계산, 점은 정본 x(1, 5, 10, 20단계)에만. QA 2026-10-15 통과(Q1~Q27), lint 경고 0"
