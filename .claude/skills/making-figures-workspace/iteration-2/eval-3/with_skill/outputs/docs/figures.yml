  spec: "단계 수에 따른 전체 성공률 곡선, p = 0.99, 0.95, 0.9 세 줄(N6-1). 강조 선은 p = 0.95(E6-1 손계산과 같은 선)"
  source_file: vol2-agent/ch06/figures/2-6-6.py
  output_file: vol2-agent/ch06/figures/2-6-6.svg
  message: "전체 성공률은 단계가 늘수록 곱으로 빠르게 떨어집니다"
  accent: "p = 0.95 곡선, 숫자 칩 0.599와 0.358"
  role: 숫자
  epub_variant: manual
  caption:
    title: "단계 수에 따른 전체 성공률"
    reading: "왼쪽에서 오른쪽으로 단계가 늘수록 세 곡선이 모두 내려가고, p가 낮은 곡선일수록 더 가파르게 떨어집니다."
    caveat: "단계마다 독립적으로 성공률 p라고 가정한 값입니다."
  alt: "단계 수 1부터 20까지 전체 성공률이 줄어드는 모습을 단계별 성공률 p = 0.99, 0.95, 0.9의 세 곡선으로 나타냈습니다. 가로축은 단계 수, 세로축은 전체 성공률이고, 강조한 곡선은 p = 0.95입니다. 이 곡선은 10단계에서 0.599, 20단계에서 0.358로 떨어지고, p = 0.99도 20단계에서 0.818까지 내려갑니다. 단계가 늘수록 전체 성공률은 곱으로 빠르게 떨어집니다."
