 <title id="fig-t">그림 2-6-6 단계 수와 전체 성공률</title>
 <desc id="fig-d">단계 수 1부터 20까지 전체 성공률이 줄어드는 모습을 단계별 성공률 p = 0.99, 0.95, 0.9의 세 곡선으로 나타냈습니다. 가로축은 단계 수, 세로축은 전체 성공률이고, 강조한 곡선은 p = 0.95입니다. 이 곡선은 10단계에서 0.599, 20단계에서 0.358로 떨어지고, p = 0.99도 20단계에서 0.818까지 내려갑니다. 단계가 늘수록 전체 성공률은 곱으로 빠르게 떨어집니다.</desc>
