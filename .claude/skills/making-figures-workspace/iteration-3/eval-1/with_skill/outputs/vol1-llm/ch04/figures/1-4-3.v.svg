<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 704" width="360" height="704" role="img" aria-labelledby="f143v-t f143v-d" font-family="Pretendard, 'Pretendard Variable', -apple-system, 'Apple SD Gothic Neo', sans-serif" style="font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'">
  <title id="f143v-t">그림 1-4-3 어텐션 계산 4단계 (EPUB 세로 변형)</title>
  <desc id="f143v-d">토큰 '안'의 어텐션 계산을 점수, 크기 조정, softmax, 가중합의 네 단계 흐름도로 나타냈습니다. 점수 1, 2, 3은 루트 2로 나누면 0.707, 1.414, 2.121이 되고, softmax를 거친 가중치는 상자가 0.140, 안 0.284, 왔어요 0.576입니다. 이 가중치로 값을 섞은 출력은 0.428과 0.572로, '안'은 '왔어요'의 정보를 가장 많이 가져옵니다.</desc>
  <defs><marker id="f143v-arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.5 L8,5 L1,8.5" fill="none" stroke="#59606B" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter"/></marker></defs>
  <rect width="360" height="704" fill="#FFFFFF"/>
  <text x="16" y="24" font-size="14" font-weight="500" fill="#6B727D" letter-spacing="0.56">그림 1-4-3</text>
  <text x="344" y="24" font-size="14" fill="#6B727D" text-anchor="end">어텐션 계산 4단계</text>
