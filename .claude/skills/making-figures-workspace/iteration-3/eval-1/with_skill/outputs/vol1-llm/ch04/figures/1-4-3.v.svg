  <text x="32" y="363" font-size="16" fill="#1F2329"><tspan font-weight="600">02 크기 조정</tspan> ÷ √d, d = 2</text>
  <text x="32" y="385" font-size="16" fill="#1F2329"><tspan font-weight="500">[0.707, 1.414, 2.121]</tspan></text>
