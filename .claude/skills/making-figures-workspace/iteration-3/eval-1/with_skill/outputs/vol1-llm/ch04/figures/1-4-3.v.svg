  <text x="32" y="267" font-size="16" fill="#1F2329"><tspan font-weight="600">01 점수</tspan> q × k</text>
  <text x="32" y="289" font-size="16" fill="#1F2329"><tspan font-weight="500">[1, 2, 3]</tspan></text>
