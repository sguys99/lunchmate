  <line x1="58" y1="144" x2="58" y2="208" stroke="#B2611C" stroke-width="4" stroke-dasharray="7.5 4.5"/>
  <text x="72" y="171" font-size="16" fill="#1F2329"><tspan font-weight="600">키 k</tspan> (상자가, 안, 왔어요)</text>
  <text x="72" y="193" font-size="16" fill="#1F2329"><tspan font-weight="500">[1, 0] [0, 1] [1, 1]</tspan></text>
