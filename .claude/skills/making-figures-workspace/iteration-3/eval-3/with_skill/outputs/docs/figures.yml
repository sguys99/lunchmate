  caption:
    title: "단계 수에 따른 전체 성공률"
    reading: "왼쪽에서 오른쪽으로 단계가 늘수록 세 곡선이 모두 내려가고, 단계 성공률 p가 낮을수록 더 가파르게 떨어집니다."
    caveat: "단계마다 같은 성공률로 서로 독립적으로 성공한다고 가정했습니다."
  alt: "단계마다 같은 성공률 p로 독립적으로 성공한다고 할 때, 단계 수 1에서 20까지의 전체 성공률을 p = 0.99, 0.95, 0.9 세 곡선으로 나타냈습니다. 세 곡선 모두 단계가 늘수록 내려가고, p가 낮을수록 더 가파르게 떨어집니다. 강조한 p = 0.95 곡선은 10단계에서 0.599, 20단계에서 0.358이고, 같은 20단계에서 p = 0.99는 0.818입니다. 단계 성공률이 0.95여도 20단계면 전체 성공률은 0.358로 떨어집니다."
