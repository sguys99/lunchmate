  note: "곡선은 E6-1 식(p의 n제곱)으로 1~20단계 사이를 촘촘히 계산해 잇고 점과 칩은 정본 점(1, 5, 10, 20단계)에만 둠, 외삽 없음. 가로축은 320 판이라 축 제목 없이 눈금에 단위를 붙임(1단계, 5단계, 10단계, 20단계, chart-guide 4.2절 제안안, style-guide 6.5절 단위 규칙과 겹쳐 저자 확인 대기). 메시지 지시선 없음: 강조 선 정본 점 위아래로 맥락 선이 지나가 문장 자리가 없어 칩 두 개와 캡션이 메시지를 맡음. 맥락 선은 p = 0.99를 rank 1(ink-600 파선), p = 0.9를 rank 2(ink-400 점선)로 둠(시안 1-5-5는 둘 다 ink-400 실선). 세로 변형(5.11절 선택): 폭 328에서 칩 숫자가 7.2 CSS px라 360 x 368 사본을 둠. QA 2026-10-15 통과(Q1~Q27), 경고 0"
