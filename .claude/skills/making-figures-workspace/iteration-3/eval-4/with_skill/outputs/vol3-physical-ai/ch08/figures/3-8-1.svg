<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-labelledby="f381-t f381-d" font-family="Pretendard, 'Pretendard Variable', -apple-system, 'Apple SD Gothic Neo', sans-serif" style="font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'">
  <title id="f381-t">그림 3-8-1 이중 시스템 VLA</title>
  <desc id="f381-d">System 2는 장면과 지시를, System 1은 잠재 표현과 고속 센서 입력을 받아 액션을 내는 두 모듈 구조를 블록으로 나타냈습니다. System 2는 VLM이며 약 7~9 Hz로 느리게, System 1은 작은 정책이며 200 Hz로 빠르게 돌아갑니다. 두 모듈은 잠재 표현 하나로 이어져, 느린 System 2가 잠재 표현으로 빠른 System 1을 이끕니다.</desc>
