<marker id="f381-arr-accent" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.5 L8,5 L1,8.5" fill="none" stroke="#5844BC" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter"/></marker></defs>
