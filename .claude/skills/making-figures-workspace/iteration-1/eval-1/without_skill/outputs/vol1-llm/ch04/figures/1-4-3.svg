  </g>
  <g data-node="k" class="c-key">
  <rect x="277.5" y="80.5" width="191" height="63" fill="#FFFFFF" stroke="#C9CDD3" stroke-width="1"/>
  <line x1="279" y1="80" x2="279" y2="144" stroke="#B2611C" stroke-width="4" stroke-dasharray="7.5 4.5"/>
  <text x="293" y="107" font-size="16" fill="#1F2329"><tspan font-weight="600">키 k</tspan> (상자가, 안, 왔어요)</text>
