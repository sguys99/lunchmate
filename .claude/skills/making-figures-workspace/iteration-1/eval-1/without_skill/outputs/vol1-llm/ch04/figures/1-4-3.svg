<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-labelledby="f143-t f143-d" font-family="Pretendard, 'Pretendard Variable', sans-serif" style="font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'">
  <title id="f143-t">그림 1-4-3 어텐션 계산의 네 단계</title>
  <desc id="f143-d">토큰 '안'의 어텐션 계산을 점수, 크기 조정, softmax, 가중합의 네 단계 흐름도로 나타냈습니다. '안'의 쿼리와 세 토큰의 키를 곱한 점수 1, 2, 3을 루트 2로 나누면 0.707, 1.414, 2.121이 됩니다. softmax를 거친 가중치는 상자가 0.140, 안 0.284, 왔어요 0.576이고, 이 가중치로 값을 섞은 출력은 0.428과 0.572입니다. '안'은 '왔어요'의 정보를 가장 많이 가져옵니다.</desc>
