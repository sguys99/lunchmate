<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-labelledby="f143-t f143-d" font-family="Pretendard, 'Pretendard Variable', sans-serif" style="font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'">
  <title id="f143-t">그림 1-4-3 어텐션 계산 4단계</title>
  <desc id="f143-d">토큰 '안'의 어텐션 계산을 내적 점수, 루트 2로 나누기, softmax, 가중합의 네 단계 흐름도로 나타냈습니다. 쿼리 [1, 2]와 세 키의 내적 점수 [1, 2, 3]을 루트 2로 나누면 [0.707, 1.414, 2.121]이 됩니다. softmax를 거친 가중치는 상자가 0.140, 안 0.284, 왔어요 0.576이고, 이 가중치로 값을 섞은 출력은 [0.428, 0.572]입니다. 가중치가 가장 큰 왔어요의 정보를 '안'이 가장 많이 가져옵니다.</desc>
