<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 584" width="360" height="584" role="img" aria-labelledby="f381v-t f381v-d" font-family="Pretendard, 'Pretendard Variable', -apple-system, 'Apple SD Gothic Neo', sans-serif" style="font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'">
  <title id="f381v-t">그림 3-8-1 이중 시스템 VLA (EPUB 세로 변형)</title>
  <desc id="f381v-d">이중 시스템 VLA의 두 모듈과 각자의 입력, 갱신 주기를 구조도로 나타냈습니다. System 2(VLM)는 카메라 이미지와 언어 지시를 받아 약 7~9 Hz로 잠재 표현을 냅니다. System 1(작은 정책)은 이 잠재 표현과 고속 센서 입력을 함께 받아 200 Hz로 행동을 냅니다. 느리게 생각하는 System 2의 결과를 빠른 System 1이 행동으로 바꿉니다.</desc>
  <defs><marker id="f381v-arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.5 L8,5 L1,8.5" fill="none" stroke="#59606B" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter"/></marker><pattern id="fill-c-token-image" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#FEF1D0"/><line x1="0" y1="3" x2="6" y2="3" stroke="#886C1D" stroke-width="1" stroke-opacity="0.75"/></pattern></defs>
  <rect width="360" height="584" fill="#FFFFFF"/>
  <text x="16" y="24" font-size="14" font-weight="500" fill="#6B727D" letter-spacing="0.56">그림 3-8-1</text>
  <text x="344" y="24" font-size="14" fill="#6B727D" text-anchor="end">이중 시스템 VLA</text>
  <line x1="16" y1="32.5" x2="344" y2="32.5" stroke="#1F2329" stroke-width="1"/>
  <g data-canon="N8-1">
  <rect x="16.5" y="56.5" width="327" height="71" fill="#FFFFFF" stroke="#C9CDD3" stroke-width="1"/>
  <rect x="32.5" y="64.5" width="103" height="23" fill="#FEF1D0" stroke="#886C1D" stroke-width="1"/><rect x="33" y="65" width="11" height="22" fill="url(#fill-c-token-image)"/><line x1="44.5" y1="64" x2="44.5" y2="88" stroke="#886C1D" stroke-width="1"/><text x="90" y="81" font-size="14" font-weight="500" fill="#1F2329" text-anchor="middle">카메라 이미지</text>
  <rect x="32.5" y="96.5" width="67" height="23" fill="#F0F1F2" stroke="#C9CDD3" stroke-width="1"/><text x="66" y="113" font-size="14" font-weight="500" fill="#1F2329" text-anchor="middle">언어 지시</text>
  <rect x="16.5" y="160.5" width="327" height="95" fill="#FFFFFF" stroke="#59606B" stroke-width="1"/>
  <text x="32" y="192" font-size="16" fill="#1F2329"><tspan font-weight="600">System 2</tspan> (VLM)</text>
  <text x="32" y="214" font-size="16" fill="#1F2329">장면과 지시를 이해</text>
  <text x="32" y="236" font-size="16" fill="#1F2329"><tspan font-weight="600">약 7~9 Hz</tspan>  느림, 1초에 약 7~9번</text>
  <rect x="16.5" y="288.5" width="151" height="71" fill="#FFFFFF" stroke="#C9CDD3" stroke-width="1"/>
  <text x="92" y="330" font-size="16" fill="#1F2329" text-anchor="middle"><tspan font-weight="600">잠재 표현</tspan></text>
  <rect x="192.5" y="288.5" width="151" height="71" fill="#FFFFFF" stroke="#C9CDD3" stroke-width="1"/>
  <text x="208" y="319" font-size="16" fill="#1F2329"><tspan font-weight="600">고속 센서 입력</tspan></text>
  <text x="208" y="341" font-size="16" fill="#1F2329">이미지, 로봇 상태</text>
  <rect x="16.75" y="392.75" width="326.5" height="94.5" fill="#F7F7F5" stroke="#1F2329" stroke-width="1.5"/>
  <text x="32" y="424" font-size="16" fill="#1F2329"><tspan font-weight="600">System 1</tspan> (작은 정책)</text>
  <text x="32" y="446" font-size="16" fill="#1F2329">잠재 표현을 행동으로</text>
  <text x="32" y="468" font-size="16" fill="#1F2329"><tspan font-weight="600">200 Hz</tspan>  빠름, 1초에 200번</text>
  <rect x="16.5" y="520.5" width="327" height="47" fill="#FFFFFF" stroke="#59606B" stroke-width="1"/>
  <line x1="18" y1="520" x2="18" y2="568" stroke="#88407B" stroke-width="4" stroke-dasharray="9 3 1.5 3"/>
  <text x="32" y="550" font-size="16" fill="#1F2329"><tspan font-weight="600">행동</tspan></text>
