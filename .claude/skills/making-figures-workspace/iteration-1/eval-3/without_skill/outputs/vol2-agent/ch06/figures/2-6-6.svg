 <title id="fig-t">그림 2-6-6 단계 수에 따른 전체 성공률</title>
 <desc id="fig-d">단계별 성공률 p가 0.99, 0.95, 0.9일 때 단계 수 1~20에 따른 전체 성공률을 선 그래프로 나타냈습니다. 세로축은 전체 성공률 0~1입니다. p = 0.95면 5단계 0.774, 10단계 0.599, 20단계 0.358로 줄고, p = 0.99는 20단계 0.818, p = 0.9는 20단계 0.122입니다. 단계가 늘수록 전체 성공률은 곱으로 빠르게 떨어집니다.</desc>
