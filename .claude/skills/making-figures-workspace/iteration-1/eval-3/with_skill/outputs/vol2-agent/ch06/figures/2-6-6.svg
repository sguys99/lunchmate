 <title id="fig-t">그림 2-6-6 단계 수와 전체 성공률</title>
 <desc id="fig-d">단계마다 서로 독립적으로 성공률 p로 성공한다고 할 때, 단계 수 1~20에 따른 전체 성공률을 p = 0.99, 0.95, 0.9 세 선으로 나타냈습니다. p = 0.99는 10단계 0.904, 20단계 0.818로 완만히 줄고, p = 0.9는 20단계에 0.122까지 떨어집니다. p = 0.95는 10단계 0.599를 거쳐 20단계 0.358까지 내려가, 단계가 쌓일수록 전체 성공률이 곱으로 줄어듭니다.</desc>
