  note: "세로 변형(5.11절 선택): 폭 328에서 칩 0.358과 선 이름이 약 7.2 CSS px라 360 사본을 둠. 선은 정본 식 p^n을 정수 단계 1~20에서 계산해 직선으로 이음, 점은 정본 단계 5, 10, 20에만(1단계는 세 점 간격 약 7px라 생략). 메시지 지시선 점은 정본 점에 깨끗한 자리가 없어 선 위 중간점(본문 15단계, 세로 변형 3단계). 본문 판은 가로축 제목 자리로 그림 영역 아래를 240에 둠(figkit lint 바깥 여백). QA 2026-10-15 통과(Q1~Q27, 해당 없음 Q9, Q24, Q26, Q27), 경고 0. 저자 확인: 세로 변형의 지시선 문장이 세로축 제목과 같은 줄(간격 8 이상)"
