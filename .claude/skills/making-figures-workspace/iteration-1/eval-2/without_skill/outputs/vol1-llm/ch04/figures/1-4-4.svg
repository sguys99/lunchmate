  <g class="num-chip" data-canon="N4-2"><rect x="180.5" y="272.5" width="55" height="23" fill="#FFFFFF" stroke="#1F2329" stroke-width="1"/><text x="188.808" y="289" font-size="14" font-weight="600" fill="#1F2329">0.140</text></g>
  <text x="320" y="289" font-size="14" fill="#6B727D" text-anchor="middle">계산 제외</text>
