<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-labelledby="f144-t f144-d" font-family="Pretendard, 'Pretendard Variable', -apple-system, 'Apple SD Gothic Neo', sans-serif" style="font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'">
  <title id="f144-t">그림 1-4-4 '안'의 어텐션 가중치</title>
  <desc id="f144-d">러닝 예문 '주문한 상자가 아직 안 왔어요'에서 토큰 '안'이 다른 토큰을 보는 정도를 띠로 나타냈고, 띠 폭이 가중치입니다. 손계산에 쓴 세 토큰의 가중치는 상자가 0.140, 안 0.284, 왔어요 0.576이고 합은 1입니다. '주문한'과 '아직'은 계산에서 뺐습니다. '안'은 '왔어요'를 가장 많이 봅니다.</desc>
    <rect width="640" height="320" fill="#FFFFFF"/>
  <text x="24" y="24" font-size="14" font-weight="500" fill="#6B727D" letter-spacing="0.56">그림 1-4-4</text>
  <text x="616" y="24" font-size="14" fill="#6B727D" text-anchor="end">'안'의 어텐션 가중치</text>
  <line x1="24" y1="32.5" x2="616" y2="32.5" stroke="#1F2329" stroke-width="1"/>
  <g class="attention-bands" data-canon="N4-2">
  <path class="band" data-token="상자가" data-weight="0.140" d="M392.00,88.00 C392.00,156.00 202.40,156.00 202.40,224.00 L213.60,224.00 C213.60,156.00 403.20,156.00 403.20,88.00 Z" fill="#C9CDD3" stroke="#FFFFFF" stroke-width="1" stroke-linejoin="round"/>
  <path class="band" data-token="안" data-weight="0.284" d="M403.20,88.00 C403.20,156.00 420.64,156.00 420.64,224.00 L443.36,224.00 C443.36,156.00 425.92,156.00 425.92,88.00 Z" fill="#C9CDD3" stroke="#FFFFFF" stroke-width="1" stroke-linejoin="round"/>
  <path class="band band-msg" data-token="왔어요" data-weight="0.576" d="M425.92,88.00 C425.92,156.00 520.96,156.00 520.96,224.00 L567.04,224.00 C567.04,156.00 472.00,156.00 472.00,88.00 Z" fill="#5844BC" stroke="#FFFFFF" stroke-width="1" stroke-linejoin="round"/>
  </g>
  <rect x="392.5" y="56.5" width="79" height="31" fill="#F0F1F2" stroke="#C9CDD3" stroke-width="1"/><text x="432" y="78" font-size="16" font-weight="500" fill="#1F2329" text-anchor="middle">안</text>
  <text x="376" y="76" font-size="14" fill="#59606B" text-anchor="end">보는 토큰</text>
  <rect class="token-off" x="56.5" y="224.5" width="79" height="31" fill="#FFFFFF" stroke="#8C929B" stroke-width="1" stroke-dasharray="4 3"/><text x="96" y="246" font-size="16" font-weight="500" fill="#6B727D" text-anchor="middle">주문한</text>
  <rect x="168.5" y="224.5" width="79" height="31" fill="#F0F1F2" stroke="#C9CDD3" stroke-width="1"/><text x="208" y="246" font-size="16" font-weight="500" fill="#1F2329" text-anchor="middle">상자가</text>
  <rect class="token-off" x="280.5" y="224.5" width="79" height="31" fill="#FFFFFF" stroke="#8C929B" stroke-width="1" stroke-dasharray="4 3"/><text x="320" y="246" font-size="16" font-weight="500" fill="#6B727D" text-anchor="middle">아직</text>
  <rect x="392.5" y="224.5" width="79" height="31" fill="#F0F1F2" stroke="#C9CDD3" stroke-width="1"/><text x="432" y="246" font-size="16" font-weight="500" fill="#1F2329" text-anchor="middle">안</text>
  <rect x="504.5" y="224.5" width="79" height="31" fill="#F0F1F2" stroke="#C9CDD3" stroke-width="1"/><text x="544" y="246" font-size="16" font-weight="500" fill="#1F2329" text-anchor="middle">왔어요</text>
