  <rect class="token-off" x="192.5" y="152.5" width="79" height="31" fill="#FFFFFF" stroke="#8C929B" stroke-width="1" stroke-dasharray="4 3"/><text x="232" y="174" font-size="16" font-weight="500" fill="#6B727D" text-anchor="middle">아직</text>
  <rect x="192.5" y="200.5" width="79" height="31" fill="#F0F1F2" stroke="#C9CDD3" stroke-width="1"/><text x="232" y="222" font-size="16" font-weight="500" fill="#1F2329" text-anchor="middle">안</text>
  <rect x="192.5" y="248.5" width="79" height="31" fill="#F0F1F2" stroke="#C9CDD3" stroke-width="1"/><text x="232" y="270" font-size="16" font-weight="500" fill="#1F2329" text-anchor="middle">왔어요</text>
